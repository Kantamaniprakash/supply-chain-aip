[project]
name = "supply-chain-aip"
version = "0.1.0"
description = "Supply chain disruption intelligence: multi-model ML risk engine, GraphSAGE contagion analysis, Monte Carlo VaR simulation, and a Palantir AIP-style agent with a Streamlit dashboard"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Satya Sai Prakash Kantamani" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core ML
    "xgboost==2.0.3",
    "scikit-learn==1.5.0",
    "optuna==3.6.1",
    "shap==0.45.1",
    # Deep learning
    "torch==2.6.0",
    "torch-geometric==2.5.3",
    # Statistical computing
    "numpy==1.26.4",
    "scipy==1.13.0",
    "pandas==2.2.2",
    # Data pipeline
    "pyspark==3.5.2",
    # Visualisation
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "plotly==5.22.0",
    # Notebook
    "jupyter==1.0.0",
    "ipywidgets==8.1.3",
    # Utilities
    "tqdm==4.66.4",
    "joblib==1.4.2",
    "jinja2==3.1.6",
    "streamlit==1.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# This repo is an application (scripts + dashboard), not an installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
